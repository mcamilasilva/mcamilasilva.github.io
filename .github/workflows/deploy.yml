name: Build and Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.19.0'
          cache: 'npm'

      - name: Install Dependencies
        # Using --legacy-peer-deps prevents installation failures caused by older package trees
        run: npm install --legacy-peer-deps 

      - name: Build Angular Application
        run: npx ng build --configuration production --base-href /

      - name: Handle Angular Routing (404 page)
        # Copies index.html to 404.html using 'docs' output path
        run: cp docs/index.html docs/404.html

      - name: Disable Jekyll
        # Prevents GitHub from hiding files starting with underscores
        run: touch docs/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs # Point this exactly to your outputPath
          branch: gh-pages # GitHub Actions will push the built files here
